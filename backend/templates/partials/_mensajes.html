{% if messages %}
  <div class="mb-5 space-y-2">
    {% for mensaje in messages %}
      <div data-mensaje="{{ mensaje.tags }}"
           class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm
        {% if mensaje.tags == 'success' %}border-marca-200 bg-marca-50 text-marca-700
        {% elif mensaje.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-700
        {% elif mensaje.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-700
        {% else %}border-slate-200 bg-white text-slate-700{% endif %}">
        <span class="mt-0.5 h-2 w-2 shrink-0 rounded-full
          {% if mensaje.tags == 'success' %}bg-marca-600
          {% elif mensaje.tags == 'error' %}bg-rose-500
          {% elif mensaje.tags == 'warning' %}bg-amber-500
          {% else %}bg-slate-400{% endif %}"></span>
        <p>{{ mensaje }}</p>
      </div>
    {% endfor %}
  </div>
{% endif %}
