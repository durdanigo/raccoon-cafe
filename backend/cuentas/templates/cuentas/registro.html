{% extends "base_publica.html" %}

{% block titulo %}Crear cuenta | Raccoon Café{% endblock %}

{% block contenido %}
<div class="rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
  <h1 class="font-display text-2xl font-semibold text-tinta-900">Crear cuenta</h1>
  <p class="mt-1 text-sm text-slate-500">Registra tus datos y empieza a reservar espacios.</p>

  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {% include "partials/_form_campos.html" %}

    <button type="submit"
            class="w-full rounded-lg bg-marca-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-marca-700">
      Crear mi cuenta
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    Ya tienes cuenta?
    <a href="{% url 'cuentas:login' %}" class="font-medium text-marca-700 hover:underline">Inicia sesion</a>
  </p>
</div>
{% endblock %}
